name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install cppcheck (linter)
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Lint with cppcheck
        run: cppcheck --enable=warning --error-exitcode=1 --quiet *.cpp

      - name: Configure the build
        run: cmake -B build

      - name: Build the game
        run: cmake --build build
      
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Play a full game to check it finishes
        run: printf '0 0\n0 1\n0 2\n1 1\n1 0\n1 2\n2 1\n2 0\n2 2\n' | timeout 10 ./build/tic_tac_toe | grep -q "draw"
      
